  <body>
    <a class="skip-link" href="#top">Skip to content</a>

    <header class="navbar" id="navbar">
      <div class="container nav-wrapper">
        <a href="#top" class="nav-brand">
          <span class="brand-mark js-initials" aria-hidden="true"></span>
          <span class="brand-name" data-kit-text="hero.name"></span>
          <span class="brand-short js-brand-short"></span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-label="Menu"
          aria-expanded="false"
          aria-controls="nav-menu"
        >
          <span></span><span></span><span></span>
        </button>
        <nav class="nav" aria-label="Sections">
          <ul class="nav-menu" id="nav-menu" data-kit="nav"></ul>
        </nav>
      </div>
    </header>

    <main id="top" tabindex="-1">
      <!-- Hero: the name in two inks, the typed title, the portrait card (or the constellation
           monogram) with the current-role card, then the readouts -->
      <section id="hero" class="band hero" data-kit-section="hero" aria-label="Introduction">
        <div class="container hero-layout">
          <div class="hero-copy">
            <p class="hero-kicker">
              <span data-kit="icon" data-icon="map-pin"></span>
              <span data-kit-text="hero.location"></span>
            </p>
            <h1 class="hero-name" data-kit-text="hero.name"></h1>
            <p class="hero-title"><span class="js-typed" data-kit-text="hero.title"></span></p>
            <p class="hero-summary" data-kit-text="hero.summary"></p>
            <div class="hero-cta" data-kit="ctas"></div>
            <div class="hero-social" data-kit="social"></div>
          </div>

          <div class="hero-visual">
            <svg class="hero-constellation js-halo" viewBox="0 0 560 640" aria-hidden="true"></svg>
            <figure class="portrait-frame" data-kit="hero-photo"></figure>
            <div class="emblem" aria-hidden="true">
              <svg
                class="emblem-svg js-emblem"
                viewBox="0 0 400 500"
                preserveAspectRatio="xMidYMid slice"
              ></svg>
            </div>
            <div class="hero-proof js-proof">
              <span class="proof-kicker js-proof-kicker"></span>
              <strong class="proof-main js-proof-main"></strong>
              <span class="proof-sub js-proof-sub"></span>
            </div>
          </div>
        </div>
        <div class="container">
          <div class="hero-highlights" data-kit="readouts"></div>
        </div>
      </section>

      <!-- About: the first paragraph as the lead, the rest beside a card of facts -->
      <section
        id="about"
        class="band section about-section"
        data-kit-section="about"
        data-kit-label="About"
      >
        <div class="container">
          <header class="section-head">
            <p class="section-index js-index" aria-hidden="true"></p>
            <h2 class="section-title">About Me</h2>
          </header>
          <div class="about-layout">
            <div class="about-text" data-kit-list="paragraphs">
              <template>
                <p class="about-p"></p>
              </template>
            </div>
            <dl class="about-facts" data-kit-list="highlights">
              <template>
                <div class="fact">
                  <dt data-kit-field="label"></dt>
                  <dd data-kit-field="value"></dd>
                </div>
              </template>
            </dl>
          </div>
        </div>
      </section>

      <!-- Experience: the evergreen spine; each role's mark and dates face its card -->
      <section
        id="experience"
        class="band section experience-section"
        data-kit-section="experience"
        data-kit-label="Experience"
      >
        <div class="container">
          <header class="section-head">
            <p class="section-index js-index" aria-hidden="true"></p>
            <h2 class="section-title">Professional Experience</h2>
          </header>
          <ol class="timeline" data-kit-list="roles">
            <template>
              <li class="tl-item">
                <div class="tl-brand">
                  <div class="tl-logo" data-kit="role-logo"></div>
                  <span class="tl-mono js-mono" aria-hidden="true"></span>
                  <div class="tl-when">
                    <p class="tl-dates" data-kit="role-dates"></p>
                    <p class="tl-loc">
                      <span data-kit="icon" data-icon="map-pin"></span>
                      <span data-kit-field="location"></span>
                    </p>
                  </div>
                </div>
                <span class="tl-node" aria-hidden="true"></span>
                <article class="tl-card">
                  <header class="tl-head">
                    <h3 class="tl-title" data-kit-field="title"></h3>
                    <p class="tl-company">
                      <a data-kit-field="company" data-kit-href="companyUrl"></a>
                    </p>
                  </header>
                  <p class="tl-desc" data-kit-field="description"></p>
                  <ul class="tl-points" data-kit-each="highlights">
                    <li></li>
                  </ul>
                  <div class="tl-earlier">
                    <p class="tl-earlier-label">Earlier roles</p>
                    <div class="tl-earlier-list" data-kit="role-earlier"></div>
                  </div>
                  <ul class="tl-tech" data-kit-each="technologies">
                    <li></li>
                  </ul>
                </article>
              </li>
            </template>
          </ol>
        </div>
      </section>

      <!-- Projects: featured work as wide split cards, alternating sides; the rest on a grid
           whose rows always close -->
      <section
        id="projects"
        class="band section projects-section"
        data-kit-section="projects"
        data-kit-label="Projects"
      >
        <div class="container">
          <header class="section-head">
            <p class="section-index js-index" aria-hidden="true"></p>
            <h2 class="section-title">Selected Projects</h2>
          </header>
          <div class="featured-list" data-kit-list="featured">
            <template>
              <article class="project-feature">
                <div class="pf-media js-visual">
                  <figure class="pf-figure" data-kit="project-media"></figure>
                </div>
                <div class="pf-body">
                  <p class="pf-meta">
                    <span class="pf-num js-num" aria-hidden="true"></span>
                    <span class="chip" data-kit-field="category"></span>
                  </p>
                  <h3 class="pf-name" data-kit-field="name"></h3>
                  <p class="pf-desc" data-kit-field="description"></p>
                  <ul class="points" data-kit-each="highlights">
                    <li></li>
                  </ul>
                  <ul class="tags" data-kit-each="technologies">
                    <li></li>
                  </ul>
                  <div class="links" data-kit="project-links"></div>
                </div>
              </article>
            </template>
          </div>
          <div class="projects-grid" data-kit-list="projects">
            <template>
              <article class="project-card">
                <div class="pc-visual js-visual">
                  <figure class="pc-figure" data-kit="project-media"></figure>
                </div>
                <div class="pc-head">
                  <p class="pc-meta">
                    <span class="pc-num js-num" aria-hidden="true"></span>
                    <span class="chip" data-kit-field="category"></span>
                  </p>
                  <h3 class="pc-name" data-kit-field="name"></h3>
                </div>
                <div class="pc-body">
                  <p class="pc-desc" data-kit-field="description"></p>
                  <ul class="points" data-kit-each="highlights">
                    <li></li>
                  </ul>
                </div>
                <div class="pc-foot">
                  <ul class="tags" data-kit-each="technologies">
                    <li></li>
                  </ul>
                  <div class="links" data-kit="project-links"></div>
                </div>
              </article>
            </template>
          </div>
        </div>
      </section>

      <!-- Skills: one card per group on a grid that never leaves an orphan -->
      <section
        id="skills"
        class="band section skills-section"
        data-kit-section="skills"
        data-kit-label="Skills"
      >
        <div class="container">
          <header class="section-head">
            <p class="section-index js-index" aria-hidden="true"></p>
            <h2 class="section-title">Skills &amp; Expertise</h2>
          </header>
          <div class="skills-grid" data-kit-list="groups">
            <template>
              <div class="skill-category">
                <div class="skill-head">
                  <span class="skill-index js-num" aria-hidden="true"></span>
                  <h3 class="skill-title" data-kit-field="name"></h3>
                </div>
                <ul class="skill-list" data-kit-each="items">
                  <li></li>
                </ul>
              </div>
            </template>
          </div>
        </div>
      </section>

      <!-- Education and certifications side by side; either one alone is centred -->
      <div class="band section credentials-band js-cred-band">
        <div class="container credentials js-credentials">
          <section
            id="education"
            class="cred-col"
            data-kit-section="education"
            data-kit-label="Education"
          >
            <header class="col-head">
              <span class="col-icon" data-kit="icon" data-icon="graduation-cap"></span>
              <div>
                <p class="col-index js-index" aria-hidden="true"></p>
                <h2 class="col-title">Education</h2>
              </div>
            </header>
            <div class="edu-list" data-kit-list="entries">
              <template>
                <article class="edu-card">
                  <p class="edu-dates" data-kit="role-dates"></p>
                  <h3 class="edu-degree">
                    <span data-kit-field="degree"></span><span class="edu-sep"> in </span
                    ><span data-kit-field="field"></span>
                  </h3>
                  <p class="edu-inst">
                    <span data-kit-field="institution"></span>
                    <span class="edu-loc" data-kit-field="location"></span>
                  </p>
                  <ul class="edu-details" data-kit-each="details">
                    <li></li>
                  </ul>
                </article>
              </template>
            </div>
          </section>

          <section
            id="certifications"
            class="cred-col"
            data-kit-section="certifications"
            data-kit-label="Certifications"
          >
            <header class="col-head">
              <span class="col-icon col-icon--gold" data-kit="icon" data-icon="award"></span>
              <div>
                <p class="col-index js-index" aria-hidden="true"></p>
                <h2 class="col-title">Certifications</h2>
              </div>
            </header>
            <ul class="cert-list" data-kit-list="items">
              <template>
                <li class="cert">
                  <div class="cert-body">
                    <a class="cert-name" data-kit-field="name" data-kit-href="url"></a>
                    <p class="cert-meta">
                      <span class="cert-issuer" data-kit-field="issuer"></span>
                      <span class="cert-date" data-kit-field="date"></span>
                    </p>
                  </div>
                </li>
              </template>
            </ul>
          </section>
        </div>
      </div>

      <!-- Contact: the invitation and the status on the left, every channel on the right -->
      <section
        id="contact"
        class="band section contact-section"
        data-kit-section="contact"
        data-kit-label="Contact"
      >
        <div class="container contact-layout">
          <div class="contact-lead">
            <p class="col-index js-index" aria-hidden="true"></p>
            <h2 class="contact-title">Get in Touch</h2>
            <p class="contact-intro" data-kit-text="contact.intro"></p>
            <p class="contact-status">
              <span class="status-dot" aria-hidden="true"></span>
              <span data-kit-text="contact.availability"></span>
            </p>
          </div>
          <ul class="contact-list" data-kit="contact-list"></ul>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <span class="brand-mark js-initials" aria-hidden="true"></span>
          <div>
            <p class="footer-name" data-kit-text="hero.name"></p>
            <p class="footer-tagline" data-kit-text="hero.title"></p>
          </div>
        </div>
        <p class="footer-copy" data-kit="footer"></p>
        <a class="back-to-top" href="#top">
          <span data-kit="icon" data-icon="chevron-down"></span>
          Back to top
        </a>
      </div>
    </footer>
  </body>
