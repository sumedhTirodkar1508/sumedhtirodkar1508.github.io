<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>PN-06 Email phishing detector schematic</title>
  <desc>An .eml or .msg file is parsed, then header, body and attachment analysis run concurrently. Their indicators are checked against VirusTotal with a SQLite cache and passed to an optional AI assessment that returns a 0 to 10 phishing score and verdict, rendered as a console report or JSON.</desc>
  <defs>
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 L0 0 L0 16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 L0 80" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.7"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#36d4be"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="360" fill="#0f1418"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

  <rect x="0" y="0" width="640" height="28" fill="#ffffff" fill-opacity="0.06"/>
  <line x1="0" y1="28" x2="640" y2="28" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="16" y="18" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#ffffff">PN-06 · PHISHING DETECTOR · EMAIL ANALYSIS SCHEMATIC</text>

  <g font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" letter-spacing="0.06em" fill="#ffffff" font-size="9">
    <rect x="16" y="150" width="120" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="26" y="168">INPUT</text>
    <text x="26" y="182" fill-opacity="0.7">.EML · .MSG FILE</text>

    <rect x="172" y="150" width="120" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="182" y="168">EMAIL_PARSER.PY</text>
    <text x="182" y="182" fill-opacity="0.7">HEADERS · MIME</text>

    <rect x="328" y="56" width="120" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="338" y="74">HEADERS</text>
    <text x="338" y="88" fill-opacity="0.7">SPF · DKIM · DMARC</text>

    <rect x="328" y="150" width="120" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="338" y="168">BODY</text>
    <text x="338" y="182" fill-opacity="0.7">URLS · TYPOSQUAT</text>

    <rect x="328" y="244" width="120" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="338" y="262">ATTACHMENTS</text>
    <text x="338" y="276" fill-opacity="0.7">HASHES · OCR</text>

    <rect x="484" y="56" width="120" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="494" y="74">VIRUSTOTAL V3</text>
    <text x="494" y="88" fill-opacity="0.7">AIOHTTP · SQLITE</text>

    <rect x="484" y="150" width="120" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="494" y="168">AI ASSESSMENT</text>
    <text x="494" y="182" fill-opacity="0.7">SCORE 0–10 · JSON</text>

    <rect x="484" y="244" width="120" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="494" y="262">REPORT</text>
    <text x="494" y="276" fill-opacity="0.7">CONSOLE · JSON</text>

    <rect x="16" y="244" width="130" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="26" y="260" fill-opacity="0.7">VERDICTS</text>
    <text x="26" y="280" font-size="10" fill="#36d4be">CLEAN · SUS · BAD</text>

    <rect x="170" y="244" width="130" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="180" y="260" fill-opacity="0.7">BRAND SPOOFING</text>
    <text x="180" y="280" font-size="10" fill="#36d4be">LEVENSHTEIN</text>

    <text x="16" y="332" fill-opacity="0.7">HEADER · BODY · ATTACHMENT ANALYSIS RUN CONCURRENTLY WITH ASYNCIO</text>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" fill="none">
    <line x1="466" y1="81" x2="483" y2="81" marker-end="url(#ah)"/>
    <line x1="544" y1="200" x2="544" y2="243" marker-end="url(#ah)"/>
  </g>
  <g stroke="#36d4be" stroke-width="1" fill="none">
    <line x1="136" y1="175" x2="171" y2="175" marker-end="url(#ahA)"/>
    <line x1="292" y1="175" x2="310" y2="175"/>
    <line x1="310" y1="81" x2="310" y2="269"/>
    <line x1="310" y1="81" x2="327" y2="81" marker-end="url(#ahA)"/>
    <line x1="310" y1="175" x2="327" y2="175" marker-end="url(#ahA)"/>
    <line x1="310" y1="269" x2="327" y2="269" marker-end="url(#ahA)"/>
    <line x1="448" y1="81" x2="466" y2="81"/>
    <line x1="448" y1="175" x2="466" y2="175"/>
    <line x1="448" y1="269" x2="466" y2="269"/>
    <line x1="466" y1="81" x2="466" y2="269"/>
    <line x1="466" y1="175" x2="483" y2="175" marker-end="url(#ahA)"/>
  </g>
</svg>
