<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-05 schemadrift pipeline</title>
<desc>Old and new SDL are parsed and diffed structurally. Usage records are reduced to a rolling 30-day window. An applyUsage downgrade rule feeds a PR report and a gate verdict. Readouts: 30d window, 0 callers for SAFE, 2 to 0 breaking in demo.</desc>
