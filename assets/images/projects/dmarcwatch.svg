<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>PN-06 dmarcwatch pipeline schematic</title>
  <desc>RUA XML reports pass through an XML reader and a tolerant parser, then analysis, feeding a console report and a browser app. The pass rate drops from 100.0% to 15.0%.</desc>
  <defs>
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 L0 0 L0 16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 L0 80" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.7"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#36d4be"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="360" fill="#0f1418"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

  <rect x="0" y="0" width="640" height="28" fill="#ffffff" fill-opacity="0.06"/>
  <line x1="0" y1="28" x2="640" y2="28" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="16" y="18" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#ffffff">PN-06 · DMARCWATCH · RUA DELIVERABILITY SCHEMATIC</text>

  <g font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" letter-spacing="0.06em" fill="#ffffff" font-size="9">
    <rect x="16" y="66" width="120" height="44" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="26" y="83">FIXTURES.TS</text>
    <text x="26" y="96" fill-opacity="0.7">SEEDED GENERATOR</text>

    <rect x="16" y="150" width="120" height="60" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="26" y="170">INPUT</text>
    <text x="26" y="184">RUA XML REPORTS</text>
    <text x="26" y="198" fill-opacity="0.7">5 DIALECTS</text>

    <rect x="172" y="150" width="120" height="60" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="182" y="170">XML.TS</text>
    <text x="182" y="184">XML READER</text>
    <text x="182" y="198" fill-opacity="0.7">DEPENDENCY-FREE</text>

    <rect x="328" y="150" width="120" height="60" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="338" y="170">RUA.TS</text>
    <text x="338" y="184">TOLERANT PARSER</text>
    <text x="338" y="198" fill-opacity="0.7">ALIGNMENT</text>

    <rect x="484" y="150" width="120" height="60" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="494" y="170">ANALYSE.TS</text>
    <text x="494" y="184">ROOT CAUSE</text>
    <text x="494" y="198" fill-opacity="0.7">CHANGEPOINT</text>

    <rect x="340" y="240" width="120" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="350" y="256">DEMO.TS</text>
    <text x="350" y="270" fill-opacity="0.7">CONSOLE REPORT</text>

    <rect x="484" y="240" width="120" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="494" y="256">SITE/CORE.MJS</text>
    <text x="494" y="270" fill-opacity="0.7">BROWSER APP</text>

    <rect x="16" y="250" width="130" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="26" y="266" fill-opacity="0.7">PASS RATE BEFORE</text>
    <text x="26" y="286" font-size="11" fill="#36d4be">100.0%</text>

    <rect x="170" y="250" width="130" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="180" y="266" fill-opacity="0.7">PASS RATE AFTER</text>
    <text x="180" y="286" font-size="11" fill="#36d4be">15.0%</text>

    <text x="16" y="332" fill-opacity="0.7">MAIL NEVER ARRIVED VS ARRIVED AND IGNORED</text>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" fill="none">
    <line x1="76" y1="110" x2="76" y2="149" marker-end="url(#ah)"/>
    <line x1="292" y1="180" x2="171" y2="180" stroke="none"/>
    <line x1="520" y1="210" x2="520" y2="226" stroke="none"/>
    <polyline points="520,210 520,226 400,226 400,239" marker-end="url(#ah)"/>
    <line x1="544" y1="210" x2="544" y2="239" marker-end="url(#ah)"/>
  </g>
  <g stroke="#36d4be" stroke-width="1" fill="none">
    <line x1="136" y1="180" x2="171" y2="180" marker-end="url(#ahA)"/>
    <line x1="292" y1="180" x2="327" y2="180" marker-end="url(#ahA)"/>
    <line x1="448" y1="180" x2="483" y2="180" marker-end="url(#ahA)"/>
    <line x1="146" y1="275" x2="169" y2="275" marker-end="url(#ahA)"/>
  </g>
</svg>