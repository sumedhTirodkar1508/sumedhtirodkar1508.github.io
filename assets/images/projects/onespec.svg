<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>PN-04 onespec schematic</title>
  <desc>One spec feeds a client validator, a server validator and a SQL CHECK. A seeded adversarial row generator sends the same rows to all three, and a parity test compares accept and reject.</desc>
  <defs>
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 L0 0 0 16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 z" fill="#ffffff" fill-opacity="0.7"/>
    </marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 z" fill="#36d4be"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="360" fill="#0f1418"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

  <rect x="0" y="0" width="640" height="28" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="16" y="18" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="0.6" fill="#ffffff">PN-04 · ONESPEC · ONE SPEC, THREE ENFORCEMENT POINTS</text>

  <g font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" letter-spacing="0.6">
    <!-- generator -->
    <rect x="24" y="44" width="140" height="44" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="94" y="62" font-size="10" fill="#ffffff" text-anchor="middle">ADVERSARIAL</text>
    <text x="94" y="77" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">seeded row generator</text>

    <!-- spec -->
    <rect x="24" y="150" width="140" height="84" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="94" y="176" font-size="11" fill="#ffffff" text-anchor="middle">SPEC</text>
    <text x="94" y="194" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">schema.ts</text>
    <text x="94" y="210" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">fields + cross-field</text>
    <text x="94" y="222" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">rules</text>

    <!-- targets -->
    <rect x="214" y="100" width="150" height="46" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="289" y="119" font-size="10" fill="#ffffff" text-anchor="middle">CLIENT</text>
    <text x="289" y="134" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">compiled closures</text>

    <rect x="214" y="170" width="150" height="46" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="289" y="189" font-size="10" fill="#ffffff" text-anchor="middle">SERVER</text>
    <text x="289" y="204" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">schema interpreter</text>

    <rect x="214" y="240" width="150" height="46" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="289" y="259" font-size="10" fill="#ffffff" text-anchor="middle">SQL</text>
    <text x="289" y="274" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">CHECK · STRICT</text>

    <!-- parity -->
    <rect x="410" y="150" width="206" height="84" fill="none" stroke="#36d4be" stroke-width="1"/>
    <text x="513" y="178" font-size="11" fill="#36d4be" text-anchor="middle">PARITY TESTS</text>
    <text x="513" y="196" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">accept / reject must agree</text>
    <text x="513" y="212" font-size="9" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">mutation test catches drift</text>

    <!-- arrows: spec to targets -->
    <path d="M164 192 H190" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M190 123 V263" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M190 123 H212" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" marker-end="url(#ah)"/>
    <path d="M190 193 H212" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" marker-end="url(#ah)"/>
    <path d="M190 263 H212" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" marker-end="url(#ah)"/>

    <!-- arrows: targets to parity -->
    <path d="M364 123 H387 V168 H408" fill="none" stroke="#36d4be" stroke-width="1" marker-end="url(#aa)"/>
    <path d="M364 193 H408" fill="none" stroke="#36d4be" stroke-width="1" marker-end="url(#aa)"/>
    <path d="M364 263 H387 V218 H408" fill="none" stroke="#36d4be" stroke-width="1" marker-end="url(#aa)"/>

    <!-- generator rows to parity -->
    <path d="M164 66 H513 V148" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/>
    <text x="300" y="60" font-size="9" fill="#ffffff" fill-opacity="0.7">same rows to all three</text>

    <!-- readouts -->
    <rect x="24" y="300" width="190" height="40" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="36" y="318" font-size="14" fill="#36d4be">3</text>
    <text x="36" y="332" font-size="9" fill="#ffffff" fill-opacity="0.7">enforcement targets</text>

    <rect x="225" y="300" width="190" height="40" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="237" y="318" font-size="14" fill="#36d4be">11</text>
    <text x="237" y="332" font-size="9" fill="#ffffff" fill-opacity="0.7">tests in npm test</text>

    <rect x="426" y="300" width="190" height="40" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="438" y="318" font-size="14" fill="#36d4be">10,000</text>
    <text x="438" y="332" font-size="9" fill="#ffffff" fill-opacity="0.7">rows per parity run</text>
  </g>
</svg>