<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>PN-07 Fraud detection model comparison schematic</title>
  <desc>BankSim transaction data is cleaned, typed and one-hot encoded, then five scikit-learn classifiers are trained and compared on precision, recall, false positives and false negatives. Naive Bayes reaches 0.9993 recall and the decision tree 0.9027 precision.</desc>
  <defs>
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 L0 0 L0 16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 L0 80" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.7"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#36d4be"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="360" fill="#0f1418"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
  <rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

  <rect x="0" y="0" width="640" height="28" fill="#ffffff" fill-opacity="0.06"/>
  <line x1="0" y1="28" x2="640" y2="28" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="16" y="18" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#ffffff">PN-07 · FRAUD DETECTION · CLASSIFIER COMPARISON</text>

  <g font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" letter-spacing="0.06em" fill="#ffffff" font-size="9">
    <rect x="328" y="56" width="276" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="338" y="74">SCIKIT-LEARN MODELS</text>
    <text x="338" y="88" fill-opacity="0.7">NAIVE BAYES · LOGREG · MLP · TREE · FOREST</text>

    <rect x="16" y="150" width="120" height="60" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="26" y="170">INPUT</text>
    <text x="26" y="184">BANKSIM CSV</text>
    <text x="26" y="198" fill-opacity="0.7">10 FEATURES</text>

    <rect x="172" y="150" width="120" height="60" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="182" y="170">CLEAN</text>
    <text x="182" y="184">STRIP · RETYPE</text>
    <text x="182" y="198" fill-opacity="0.7">DROP ZIP COLUMNS</text>

    <rect x="328" y="150" width="120" height="60" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="338" y="170">ENCODE</text>
    <text x="338" y="184">ONE-HOT</text>
    <text x="338" y="198" fill-opacity="0.7">PANDAS DUMMIES</text>

    <rect x="484" y="150" width="120" height="60" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="494" y="170">EVALUATE</text>
    <text x="494" y="184">PRECISION · RECALL</text>
    <text x="494" y="198" fill-opacity="0.7">FP / FN COST</text>

    <rect x="16" y="244" width="130" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="26" y="260" fill-opacity="0.7">TRANSACTIONS</text>
    <text x="26" y="280" font-size="11" fill="#36d4be">594,643</text>

    <rect x="170" y="244" width="130" height="50" fill="#0f1418" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <text x="180" y="260" fill-opacity="0.7">FRAUD CASES</text>
    <text x="180" y="280" font-size="11" fill="#36d4be">7,200</text>

    <rect x="328" y="244" width="120" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="338" y="260" fill-opacity="0.7">RECALL · NB</text>
    <text x="338" y="280" font-size="11" fill="#36d4be">0.9993</text>

    <rect x="484" y="244" width="120" height="50" fill="#0f1418" stroke="#36d4be" stroke-width="1"/>
    <text x="494" y="260" fill-opacity="0.7">PRECISION · TREE</text>
    <text x="494" y="280" font-size="11" fill="#36d4be">0.9027</text>

    <text x="16" y="332" fill-opacity="0.7">HEAVY CLASS IMBALANCE · 1.2% FRAUD · SYNTHETIC BANKSIM DATA</text>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" fill="none">
    <line x1="388" y1="210" x2="388" y2="243" stroke="none"/>
    <line x1="544" y1="210" x2="544" y2="243" stroke-dasharray="3 3"/>
  </g>
  <g stroke="#36d4be" stroke-width="1" fill="none">
    <line x1="136" y1="180" x2="171" y2="180" marker-end="url(#ahA)"/>
    <line x1="292" y1="180" x2="327" y2="180" marker-end="url(#ahA)"/>
    <line x1="388" y1="150" x2="388" y2="107" marker-end="url(#ahA)"/>
    <line x1="544" y1="106" x2="544" y2="149" marker-end="url(#ahA)"/>
  </g>
</svg>
